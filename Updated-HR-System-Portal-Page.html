<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR System — Muhannad El Halawany</title>
<style>
  :root{
    --bg:#2e2d2d; --panel:#232222; --header:#141212; --card:#313131;
    --ink:#e0e0e0; --muted:#cccccc; --line:#3d3b3b;
    --amber:#ffb430; --amber-deep:#ec801c; --warn:#e05c4f;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:Arial, sans-serif; opacity:0; transition:opacity .5s ease;
  }
  body.loaded{opacity:1}

  .app{min-height:100vh; display:flex; flex-direction:column}

  header{
    position:sticky; top:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center; gap:24px;
    background:var(--header); padding:10px 40px;
    box-shadow:0 5px 15px rgba(0,0,0,0.5);
  }
  .brand{display:flex; align-items:center; padding:8px 0; flex:none}
  .brand .mark{
    font-size:36px; font-weight:bold; font-family:Georgia, serif;
    color:var(--amber); margin-right:12px; text-shadow:0 0 10px var(--amber);
    animation:glow 2s infinite;
  }
  @keyframes glow{
    0%{text-shadow:0 0 0 var(--amber)}
    50%{text-shadow:0 0 12px var(--amber)}
    100%{text-shadow:0 0 0 var(--amber)}
  }
  .brand h1{margin:0; font-size:20px; color:var(--amber); letter-spacing:.3px}
  .brand p{margin:4px 0 0; font-size:12px; color:var(--muted); letter-spacing:1px}

  nav ul{list-style:none; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; margin:0; padding:0}
  nav a{
    display:inline-block; text-decoration:none; color:#d3d3d3; font-weight:bold; font-size:15px;
    padding:8px 18px; border-radius:20px; transition:all .3s ease; border:1px solid transparent;
  }
  nav a:hover{color:var(--amber-deep)}
  nav a.active{background:var(--amber); color:#141212}
  nav a.active:hover{background:var(--header); color:var(--amber-deep); border-color:var(--amber-deep)}

  main{flex:1; width:100%; max-width:1160px; margin:0 auto; padding:72px 40px 56px}

  .intro{text-align:center; max-width:640px; margin:0 auto 56px}
  .intro h2{margin:0 0 14px; font-size:40px; line-height:1.15; color:var(--amber-deep)}
  .intro p{margin:0; font-size:17px; line-height:1.65; color:var(--muted)}

  /* Cards wrap automatically: 1, 2, 3, 4 ... cards all lay out without CSS changes */
  .grid{display:flex; flex-wrap:wrap; justify-content:center; gap:32px}
  .card{
    flex:1 1 320px; max-width:540px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:44px 36px 40px; display:flex; flex-direction:column; align-items:center;
    text-align:center; box-shadow:0 4px 12px rgba(239,156,12,0.18);
    transition:transform .3s, box-shadow .3s; position:relative;
  }
  .card:hover{transform:translateY(-5px); box-shadow:0 10px 30px rgba(239,156,12,0.32)}
  .card.soon{opacity:.75}
  .card.soon:hover{transform:none; box-shadow:0 4px 12px rgba(239,156,12,0.18)}
  .badge{
    position:absolute; top:16px; right:16px; font-size:11px; font-weight:bold; letter-spacing:.8px;
    text-transform:uppercase; color:var(--amber); border:1px solid var(--amber); border-radius:20px; padding:3px 10px;
  }
  .icon{
    width:84px; height:84px; border-radius:50%; background:var(--header);
    display:flex; align-items:center; justify-content:center; margin-bottom:26px;
    box-shadow:0 0 18px rgba(255,180,48,0.35);
  }
  .icon svg{width:38px; height:38px; stroke:var(--amber); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .card h3{margin:0 0 12px; font-size:26px; color:var(--ink)}
  .card p{margin:0 0 34px; font-size:16px; line-height:1.65; color:var(--muted); flex:1; max-width:420px}

  .btn{
    display:inline-block; width:100%; max-width:320px; padding:15px 24px; border:none; border-radius:12px;
    background:var(--amber); color:#141212; font-weight:bold; font-size:16px;
    text-decoration:none; text-align:center; cursor:pointer;
    transition:background-color .3s, transform .3s;
  }
  .btn:hover{background:var(--amber-deep); transform:scale(0.97)}
  .btn:active{transform:scale(0.92)}
  .btn.disabled{background:#4a4848; color:#999; cursor:not-allowed}
  .btn.disabled:hover,.btn.disabled:active{background:#4a4848; transform:none}
  a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--amber); outline-offset:3px}

  .notice{
    display:none; margin:28px auto 0; max-width:640px; padding:13px 18px; border-radius:10px;
    background:#3a2321; border:1px solid #5a2f2b; color:var(--warn); font-size:14px; text-align:center;
  }
  .notice.show{display:block}

  /* Open positions */
  .jobs{margin-top:72px; scroll-margin-top:90px}
  .jobs-head{text-align:center; margin-bottom:28px}
  .jobs-head h2{margin:0 0 10px; font-size:30px; color:var(--amber-deep)}
  .jobs-head p{margin:0; font-size:15px; line-height:1.6; color:var(--muted)}
  .jobs-list{display:flex; flex-direction:column; gap:14px; max-width:860px; margin:0 auto}
  .job{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 26px;
    box-shadow:0 4px 12px rgba(239,156,12,0.12); transition:transform .3s, box-shadow .3s;
  }
  .job:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(239,156,12,0.25)}
  .job h3{margin:0 0 10px; font-size:20px; color:var(--ink)}
  .dept{display:inline-block; font-size:13px; color:var(--amber); background:var(--header); border:1px solid #5a4a22; border-radius:20px; padding:3px 12px}
  .job .btn{width:auto; max-width:none; flex:none; padding:12px 24px; font-size:15px}
  .jobs-status{text-align:center; color:var(--muted); font-size:15px; line-height:1.6; padding:32px 20px; background:var(--panel); border:1px solid var(--line); border-radius:12px}
  .jobs-status.error{color:var(--warn); background:#3a2321; border-color:#5a2f2b}
  .jobs-status .btn{display:block; width:auto; margin:16px auto 0; padding:10px 24px}

  footer{background:var(--header); padding:18px 40px; text-align:center; font-size:13px; color:#777; box-shadow:0 -5px 15px rgba(0,0,0,0.3)}
  footer b{color:var(--amber)}

  @media (max-width:900px){
    header{padding:10px 20px}
    main{padding:48px 20px 40px}
    .intro h2{font-size:30px}
    nav{display:none}
    .jobs{margin-top:56px}
    .job{flex-direction:column; align-items:stretch; padding:20px}
    .job .btn{width:100%}
  }
  @media (prefers-reduced-motion:reduce){.brand .mark{animation:none}.card,.btn{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">M</span>
      <div>
        <h1>Muhannad El Halawany</h1>
        <p>HR SYSTEM</p>
      </div>
    </div>
    <nav aria-label="Main"><ul id="navList"></ul></nav>
  </header>

  <main>
    <section class="intro">
      <h2>Welcome to the HR Portal</h2>
      <p>Choose a service below to get started.</p>
    </section>

    <section class="grid" id="grid" aria-label="HR services"></section>

    <div class="notice" id="notice" role="alert"></div>

    <section class="jobs" id="jobs" aria-labelledby="jobsTitle">
      <div class="jobs-head">
        <h2 id="jobsTitle">Open Positions</h2>
        <p>Know someone who would be a great fit? Refer them for any role below.</p>
      </div>
      <div class="jobs-list" id="jobsList" aria-live="polite"></div>
    </section>
  </main>

  <footer>HR System &middot; Designed by <b>Muhannad El Halawany</b></footer>
</div>

<script>
/* ==========================================================================
   HOW TO ADD A NEW LINK / FEATURE
   --------------------------------------------------------------------------
   Add ONE object to the SERVICES list below. That's it — the card, the
   header link and the layout are all created from this list automatically.
   No HTML or CSS changes needed.

   ALL LINKS LIVE HERE: each service's `url:` is where you paste its link.

   Fields:
     id          unique short name, e.g. 'payslips'
     title       card heading
     desc        one or two sentences under the heading
     button      text on the button
     icon        one of: calendar, chat, user, document, clock, briefcase, bell, link
                 (add more in the ICONS list further down)
     url         the address this button opens (paste the link here)
     comingSoon  optional. true = shows a "Soon" badge and a disabled button
     newTab      optional. true = opens in a new browser tab
   ========================================================================== */
const SERVICES = [
  {
    id:'leave',
    title:'Leave Request',
    desc:'Fill in the form to request annual, sick, or other leave. Your request is sent to HR for approval.',
    button:'Open Leave Request',
    icon:'calendar',
    url:'https://forms.gle/x1A6ZqWy4pn22CfJ8'   // <-- Leave Request form link
  },
  {
    id:'chat',
    title:'HR Chatbot',
    desc:'Get instant answers to your HR questions: policies, benefits, working hours, and more.',
    button:'Open HR Chatbot',
    icon:'chat',
    url:'https://muhannad7v.github.io/HRSystem/Updated-Chatbot-Page'                           // <-- HR Chatbot page link
  }

  /* Example — remove the comment marks and add a comma after the item above:
  ,{
    id:'payslips',
    title:'Payslips',
    desc:'View and download your monthly payslips.',
    button:'Open Payslips',
    icon:'document',
    url:'',
    comingSoon:true
  }
  */
];

/* ==========================================================================
   OPEN POSITIONS
   Paste the n8n webhook link that returns the open positions here.
   The list on the page updates by itself whenever HR changes the
   Job Openings sheet — no code changes needed.
   ========================================================================== */
const JOBS_WEBHOOK_URL = 'https://muhanadh.app.n8n.cloud/webhook/open-positions';  // <-- Open positions webhook link
const JOBS_REFRESH_MS  = 120000;                           // re-check every 2 minutes while the page is open

const ICONS = {
  calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  document:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};

/* ---------- Rendering (no need to edit below when adding services) ---------- */
document.body.classList.add('loaded');

const grid=document.getElementById('grid'),
      navList=document.getElementById('navList'),
      notice=document.getElementById('notice');

// A link counts as "not set" if it is empty or still the PASTE_… placeholder.
const hasUrl=s=>!!(s.url&&s.url.trim()&&!/^PASTE_/i.test(s.url.trim()));

function el(tag,cls,text){
  const n=document.createElement(tag);
  if(cls) n.className=cls;
  if(text!==undefined) n.textContent=text;
  return n;
}

function renderNav(){
  const home=el('li'); const a=el('a','active','Home'); a.href='#'; home.appendChild(a); navList.appendChild(home);
  SERVICES.filter(s=>!s.comingSoon).forEach(s=>{
    const li=el('li'); const l=el('a','go',s.title); l.href='#'; l.dataset.id=s.id; li.appendChild(l); navList.appendChild(li);
  });
}

function renderCards(){
  SERVICES.forEach(s=>{
    const card=el('article','card'+(s.comingSoon?' soon':''));
    if(s.comingSoon) card.appendChild(el('span','badge','Soon'));

    const icon=el('div','icon'); icon.setAttribute('aria-hidden','true');
    icon.innerHTML='<svg viewBox="0 0 24 24">'+(ICONS[s.icon]||ICONS.link)+'</svg>';
    card.appendChild(icon);

    card.appendChild(el('h3','',s.title));
    card.appendChild(el('p','',s.desc));

    if(s.comingSoon){
      const b=el('span','btn disabled',s.button||'Coming soon'); b.setAttribute('aria-disabled','true'); card.appendChild(b);
    }else{
      const b=el('a','btn go',s.button||('Open '+s.title)); b.href='#'; b.dataset.id=s.id; card.appendChild(b);
    }
    grid.appendChild(card);
  });
}

document.addEventListener('click',e=>{
  const t=e.target.closest('.go'); if(!t) return;
  e.preventDefault();
  const s=SERVICES.find(x=>x.id===t.dataset.id); if(!s) return;
  if(!hasUrl(s)){
    notice.textContent=s.title+' is not available yet. Please contact HR.';
    notice.classList.add('show');
    notice.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  const url=s.url.trim();
  if(s.newTab) window.open(url,'_blank','noopener'); else window.location.href=url;
});

/* ---------- Open positions ---------- */
const jobsList=document.getElementById('jobsList');
const jobsConfigured=/^https?:\/\//i.test((JOBS_WEBHOOK_URL||'').trim());

// Only allow http(s) links so a bad sheet value can never run script.
function safeLink(u){
  try{ const x=new URL(String(u||'').trim()); return /^https?:$/.test(x.protocol)?x.href:''; }
  catch(e){ return ''; }
}
// Match sheet columns loosely: "Job Title", "job_title", "Title" all work.
function pickField(row,names){
  for(const k of Object.keys(row||{})){
    if(names.includes(k.toLowerCase().replace(/[^a-z]/g,''))){
      const v=String(row[k]==null?'':row[k]).trim();
      if(v) return v;
    }
  }
  return '';
}
function normalizeJobs(data){
  let rows=Array.isArray(data)?data:(data&&(data.positions||data.jobs||data.data))||[];
  if(!Array.isArray(rows)) rows=[];
  return rows.map(r=>({
    title:pickField(r,['jobtitle','title','position']),
    department:pickField(r,['department','dept']),
    link:safeLink(pickField(r,['referrallink','referralurl','referral','link','url'])),
    status:pickField(r,['status'])
  })).filter(j=>j.title && (!j.status || j.status.toLowerCase()==='open'));
}

function showJobsStatus(text,isError,withRetry){
  jobsList.replaceChildren();
  const box=el('div','jobs-status'+(isError?' error':''),text);
  box.setAttribute('role',isError?'alert':'status');
  if(withRetry){
    const b=el('button','btn','Try again'); b.type='button';
    b.addEventListener('click',loadJobs);
    box.appendChild(b);
  }
  jobsList.appendChild(box);
}
function renderJobs(jobs){
  if(!jobs.length){ showJobsStatus('There are no open positions right now. Please check back soon.',false); return; }
  jobsList.replaceChildren();
  jobs.forEach(j=>{
    const row=el('article','job');
    const info=el('div','job-info');
    info.appendChild(el('h3','',j.title));
    if(j.department) info.appendChild(el('span','dept',j.department));
    row.appendChild(info);
    if(j.link){
      const a=el('a','btn','Refer a Candidate');
      a.href=j.link; a.target='_blank'; a.rel='noopener noreferrer';
      row.appendChild(a);
    }else{
      const b=el('span','btn disabled','Referral link unavailable'); b.setAttribute('aria-disabled','true');
      row.appendChild(b);
    }
    jobsList.appendChild(row);
  });
}

let jobsLoading=false, jobsLoaded=false;
async function loadJobs(){
  if(!jobsConfigured){ showJobsStatus('Open positions are not available yet. Please contact HR.',true,false); return; }
  if(jobsLoading) return;
  jobsLoading=true;
  if(!jobsLoaded) showJobsStatus('Loading open positions…',false);
  const ctrl=new AbortController(), timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch(JOBS_WEBHOOK_URL.trim(),{cache:'no-store',signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    renderJobs(normalizeJobs(await res.json()));
    jobsLoaded=true;
  }catch(err){
    // A failed background refresh keeps the list already on screen.
    if(!jobsLoaded) showJobsStatus('We could not load the open positions. Check your connection and try again.',true,true);
  }finally{ clearTimeout(timer); jobsLoading=false; }
}
function initJobs(){
  const li=el('li'); const a=el('a','','Open Positions'); a.href='#jobs'; li.appendChild(a); navList.appendChild(li);
  loadJobs();
  setInterval(()=>{ if(!document.hidden) loadJobs(); },JOBS_REFRESH_MS);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadJobs(); });
}

renderNav(); renderCards(); initJobs();
</script>
</body>
</html>
