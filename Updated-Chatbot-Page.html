<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — Muhannad El Halawany</title>
<style>
  :root{
    --bg:#2e2d2d; --panel:#232222; --header:#141212; --card:#313131;
    --ink:#e0e0e0; --muted:#cccccc; --line:#3d3b3b;
    --amber:#ffb430; --amber-deep:#ec801c; --warn:#e05c4f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:Arial, sans-serif; display:block;
    padding:0; opacity:0; transition:opacity .5s ease;
  }
  body.loaded{opacity:1}

  .app{
    width:100%; background:var(--panel);
    overflow:hidden; display:flex; flex-direction:column;
    height:100vh;
  }

  header{
    background-color:var(--header);
    padding:14px 40px 16px;
    box-shadow:0 5px 15px rgba(0,0,0,0.5);
    display:flex; flex-direction:column; gap:14px;
  }
  .brand{display:flex; align-items:center}
  .brand .mark{
    font-size:32px; font-weight:bold; font-family:Georgia, serif;
    color:var(--amber); margin-right:10px; text-shadow:0 0 10px var(--amber);
    animation:glow 2s infinite;
  }
  @keyframes glow{
    0%{text-shadow:0 0 0 var(--amber)}
    50%{text-shadow:0 0 12px var(--amber)}
    100%{text-shadow:0 0 0 var(--amber)}
  }
  .brand .name h1{
    margin:0; font-size:19px; color:var(--amber); letter-spacing:.3px;
  }
  .brand .name p{margin:3px 0 0; font-size:12px; color:var(--muted); letter-spacing:1px}

  .field{display:flex; flex-direction:column; gap:6px; max-width:760px}
  label{font-size:12px; color:var(--muted); font-weight:bold; letter-spacing:.3px}
  input,textarea,button{font-family:inherit; color:inherit}
  #hook{
    width:100%; padding:10px 12px; border:1px solid #555; border-radius:8px;
    background:rgb(31 30 30 / 80%); font-size:14px;
  }
  #hook:focus,#msg:focus{
    border-color:var(--amber); outline:none; box-shadow:0 0 8px rgba(255,180,48,0.5);
  }
  .hint{font-size:12px; color:var(--muted); margin:0}
  .hint.bad{color:var(--warn)}

  #log{flex:1; overflow-y:auto; padding:28px max(40px, calc((100% - 980px) / 2)); display:flex; flex-direction:column; gap:14px; background:var(--bg)}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .who{font-size:12px; color:var(--muted); margin:0 0 4px}
  .bubble{
    max-width:68%; padding:12px 16px; font-size:16px; line-height:1.55; border-radius:14px; white-space:pre-wrap; word-wrap:break-word;
  }
  .me .bubble{background:var(--amber); color:#141212; font-weight:bold; border-bottom-right-radius:4px}
  .ai .bubble{background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; box-shadow:0 4px 8px rgba(239,156,12,0.15)}
  .ai.error .bubble{background:#3a2321; border-color:#5a2f2b; color:var(--warn)}
  .empty{margin:auto; text-align:center; color:var(--muted); max-width:34ch; font-size:15px}

  form{display:flex; gap:12px; padding:16px max(40px, calc((100% - 980px) / 2)); background:var(--header); align-items:flex-end}
  #msg{
    flex:1; resize:none; max-height:140px; padding:11px 14px; border:1px solid #555;
    border-radius:11px; background:rgb(31 30 30 / 80%);
  }
  #send{
    background:var(--amber); color:#141212; border:none; border-radius:11px;
    padding:11px 22px; font-weight:bold; cursor:pointer; transition:background-color .3s, transform .3s;
  }
  #send:hover{background:var(--amber-deep)}
  #send:active{transform:scale(0.92)}
  #send:disabled{opacity:.45; cursor:not-allowed; transform:none}

  .dots span{
    display:inline-block; width:6px; height:6px; margin-right:4px; border-radius:50%;
    background:var(--muted); animation:b 1.1s infinite;
  }
  .dots span:nth-child(2){animation-delay:.15s}
  .dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dots span,.brand .mark{animation:none;opacity:.7}}

  #log::-webkit-scrollbar{width:8px}
  #log::-webkit-scrollbar-thumb{background:#555; border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">M</span>
      <div class="name">
        <h1>Muhannad El Halawany</h1>
        <p>CHAT ASSISTANT</p>
      </div>
    </div>
  </header>

  <div id="log" aria-live="polite">
    <p class="empty">Ask a question about HR policies, benefits, or working hours to get started.</p>
  </div>

  <form id="form">
    <textarea id="msg" rows="1" placeholder="Type a message… (Enter to send)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
document.body.classList.add('loaded');

/* ==========================================================================
   WEBHOOK URL — paste your webhook link between the quotes below.
   ========================================================================== */
const WEBHOOK_URL = 'https://halawany.app.n8n.cloud/webhook/ChatbotAI';

const log=document.getElementById('log'),form=document.getElementById('form'),
      msg=document.getElementById('msg'),send=document.getElementById('send');

msg.addEventListener('input',()=>{ msg.style.height='auto'; msg.style.height=Math.min(msg.scrollHeight,140)+'px'; });
msg.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); form.requestSubmit(); }});

function add(text,who,isError){
  const empty=log.querySelector('.empty'); if(empty) empty.remove();
  const row=document.createElement('div');
  row.className='row '+(who==='me'?'me':'ai')+(isError?' error':'');
  const wrap=document.createElement('div');
  if(who!=='me'){ const w=document.createElement('p'); w.className='who'; w.textContent='AI'; wrap.appendChild(w); }
  const b=document.createElement('div'); b.className='bubble';
  if(text===null){ b.innerHTML='<span class="dots"><span></span><span></span><span></span></span>'; }
  else b.textContent=text;
  wrap.appendChild(b); row.appendChild(wrap); log.appendChild(row);
  log.scrollTop=log.scrollHeight;
  return {row,bubble:b};
}

function readReply(data){
  if(typeof data==='string') return data;
  if(Array.isArray(data)) return readReply(data[0]);
  if(data&&typeof data==='object'){
    for(const k of ['reply','output','response','text','message','answer','result','content']){
      if(typeof data[k]==='string') return data[k];
      if(data[k]&&typeof data[k]==='object') return readReply(data[k]);
    }
    return JSON.stringify(data,null,2);
  }
  return 'The webhook replied, but with no readable text.';
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const url=WEBHOOK_URL.trim(), text=msg.value.trim();
  if(!text) return;

  add(text,'me');
  msg.value=''; msg.style.height='auto';
  if(!/^https?:\/\//i.test(url)){
    add('The chatbot is not available right now. Please contact HR.','ai',true);
    return;
  }
  send.disabled=true;
  const pending=add(null,'ai');

  try{
    const res=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,sessionId:sessionId(),timestamp:new Date().toISOString()})
    });
    const raw=await res.text();
    if(!res.ok) throw new Error('The webhook returned '+res.status+'. '+(raw.slice(0,200)||''));
    let data; try{ data=JSON.parse(raw); }catch(_){ data=raw; }
    pending.bubble.textContent=readReply(data)||'(empty reply)';
  }catch(err){
    pending.row.classList.add('error');
    pending.bubble.textContent=(err.message==='Failed to fetch')
      ? 'Could not reach the webhook. Check the URL is live and that it allows requests from this page (CORS).'
      : err.message;
  }finally{
    send.disabled=false; msg.focus(); log.scrollTop=log.scrollHeight;
  }
});

function sessionId(){
  try{
    let id=sessionStorage.getItem('chat_session');
    if(!id){ id='s-'+Math.random().toString(36).slice(2,10); sessionStorage.setItem('chat_session',id); }
    return id;
  }catch(e){ return 's-temp'; }
}
</script>
</body>
</html>
